name: Compilar y publicar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar firma (opcional, si hay secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/utubeorigin.jks
            printf 'storeFile=keystore/utubeorigin.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > signing.properties
            echo "Firma configurada."
          else
            echo "Sin secrets de firma: se generara un APK sin firmar."
          fi

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :app:testReleaseUnitTest

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Compilar APK
        run: ./gradlew :app:assembleRelease

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: JamasADS-Estable
          path: app/build/outputs/apk/release/app-release.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: JamasADS-Estable

      - name: Crear Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
